[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netcontrol-pinning-lab"
version = "0.1.0"
description = "Complex Network Structural Controllability, Submodular Gramian Actuator Selection, and Differentiable Graph Neural Pinning Control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ninghan Wen"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
